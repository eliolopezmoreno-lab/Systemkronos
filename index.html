      // =============================================================================
      // 2. GENERADOR DE AUDIO NATIVO WEB (WEB AUDIO API)
      // =============================================================================
      let audioCtx = null;
      let audio_on = true;

      function initAudio() {
        if (!audioCtx)
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      function playSound(tipo) {
        if (!audio_on || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        let dur = 0.1;
        let t = audioCtx.currentTime;

        if (tipo === "click") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(600, t);
          dur = 0.1;
          gain.gain.setValueAtTime(0.5, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + dur);
        } else if (tipo === "tecleo") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(950, t);
          dur = 0.05;
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + dur);
        } else if (tipo === "impacto") {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(45, t);
          dur = 0.5;
          gain.gain.setValueAtTime(0.8, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + dur);
        } else if (tipo === "exito") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(850, t);
          dur = 0.2;
          osc.frequency.linearRampToValueAtTime(1200, t + dur);
          gain.gain.setValueAtTime(0.5, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + dur);
        } else if (tipo === "laser") {
          osc.type = "square";
          osc.frequency.setValueAtTime(1200, t);
          dur = 0.4;
          osc.frequency.exponentialRampToValueAtTime(100, t + dur);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + dur);
        } else if (tipo === "error") {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(120, t);
          dur = 0.6;
          osc.frequency.linearRampToValueAtTime(80, t + dur);
          gain.gain.setValueAtTime(0.6, t);
          gain.gain.linearRampToValueAtTime(0.01, t + dur);
        } else if (tipo === "sirena" || tipo === "pirotecnia") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(400, t);
          dur = 1.0;
          osc.frequency.linearRampToValueAtTime(600, t + 0.5);
          osc.frequency.linearRampToValueAtTime(400, t + 1.0);
          gain.gain.setValueAtTime(0.4, t);
          gain.gain.linearRampToValueAtTime(0.01, t + dur);
        }
        osc.start(t);
        osc.stop(t + dur);
      }

      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }

      // =============================================================================

      function ctxRect(r, fill, stroke, r_rad = 0, lw = 2) {
        ctx.beginPath();
        ctx.roundRect(r.x, r.y, r.w, r.h, r_rad);
        if (fill) {
          ctx.fillStyle = fill;
          ctx.fill();
        }
        if (stroke) {
          ctx.lineWidth = lw;
          ctx.strokeStyle = stroke;
          ctx.stroke();
        }
      }

      function drawTextBorde(txt, x, y, font_s, col1, col2) {
        ctx.font = `bold ${font_s}px 'Courier New'`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = col2;
        [-2, 0, 2].forEach((ox) =>
          [-2, 0, 2].forEach((oy) => {
            if (ox !== 0 || oy !== 0) ctx.fillText(txt, x + ox, y + oy);
          })
        );
        ctx.fillStyle = col1;
        ctx.fillText(txt, x, y);
      }

      function drawText(txt, x, y, font_s, color, align = "center") {
        ctx.font = `bold ${font_s}px 'Courier New'`;
        ctx.fillStyle = color;
        ctx.textAlign = align;
        ctx.textBaseline = "middle";
        ctx.fillText(txt, x, y);
      }

      function col(px, py, rect) {
        return (
          px >= rect.x &&
          px <= rect.x + rect.w &&
          py >= rect.y &&
          py <= rect.y + rect.h
        );

          let dt = (t - t_ultimo_frame_flash) / 1000.0;
          if (!mostrar_explicacion_flash) {
            tiempo_flash_restante = Math.max(0, tiempo_flash_restante - dt);
            tiempo_flash_usado += dt;
            if (tiempo_flash_restante === 0) juego_estado = "FLASH_RESULTADO";
          }
        }
        t_ultimo_frame_flash = t;

        // --- PROCESAMIENTO DE CLICS ---
        if (clickEvt) {
          let ev = clickEvt;
          if (juego_estado === "INTRO") {
            if (linea_actual < texto_intro.length) {
              linea_actual = texto_intro.length;
              caracteres = 0;
              playSound("click");
            } else if (col(ev.x, ev.y, rects.continuar)) {
              playSound("click");
              juego_estado = "MENU";
            }
          } else if (juego_estado === "MENU") {
            for (let i = 0; i < 3; i++) {
              if (
                col(ev.x, ev.y, {
                  x: ANCHO / 2 - 150,
                  y: ALTO * 0.38 + i * 70,
                  w: 300,
                  h: 50,
                })
              ) {
                playSound("click");
                if (i === 0) {
                  preparar_fase1();
                  sig_estado_puertas = "JUEGO";
                  juego_estado = "CERRANDO";
                }
                if (i === 1) {
                  juego_estado = "INSTRUCCIONES";
                  pagina_instrucciones = 0;
                }
                if (i === 2) {
                  audio_on = !audio_on;
                }
              }
            }
            if (
              flash_desbloqueado &&
              col(ev.x, ev.y, {
                x: ANCHO / 2 - 175,
                y: ALTO * 0.38 + 3 * 70,
                w: 350,
                h: 55,
              })
            ) {
              playSound("click");
              preparar_preguntas_flash();
              sig_estado_puertas = "FLASH_CORE";
              juego_estado = "CERRANDO";
            }
          } else if (juego_estado === "INSTRUCCIONES") {
            let btn_volver = {
              x: ANCHO / 2 - 220,
              y: ALTO * 0.88,
              w: 200,
              h: 40,
            };
            let btn_sig = { x: ANCHO / 2 + 20, y: ALTO * 0.88, w: 200, h: 40 };
            if (col(ev.x, ev.y, btn_volver)) {
              playSound("click");
              if (pagina_instrucciones === 1) pagina_instrucciones = 0;
              else juego_estado = "MENU";
            }
            if (pagina_instrucciones === 0 && col(ev.x, ev.y, btn_sig)) {
              playSound("click");
              pagina_instrucciones = 1;
            }
          } else if (juego_estado === "JUEGO") {
            rects.f1_opciones.forEach((r, i) => {
              if (
                col(ev.x, ev.y, {
                  x: r.x + vibracion_offset_x,
                  y: r.y + vibracion_offset_y,
                  w: r.w,
                  h: r.h,
                })
              ) {
                if (opciones_actuales[i] === retos_partida[indice_reto].t) {
                  playSound("exito");
                  indice_reto++;
                  progreso_descifrado = 0;
                  if (indice_reto === 3) {
                    juego_estado = "PLUS_POPUP";
                    tiempo_emergencia = t;
                    playSound("sirena");
                  } else configurar_opciones_f1(retos_partida[indice_reto].t);
                } else {
                  playSound("error");
                  tiempo_destello_error = t;
                  intentos--;
                  feedback_f1_e = retos_partida[indice_reto].e;
                  feedback_f1_t = retos_partida[indice_reto].t;
                  juego_estado = "FASE1_EXPLICACION";
                }
              }
            });
          } else if (juego_estado === "FASE1_EXPLICACION") {
            playSound("click");
            if (intentos <= 0) {
              sig_estado_puertas = "GAME_OVER";
              juego_estado = "CERRANDO";
            } else {
              let nf =
                POOL_FASE1[Math.floor(Math.random() * POOL_FASE1.length)];
              retos_partida[indice_reto] = nf;
              configurar_opciones_f1(nf.t);
              progreso_descifrado = 0;
              juego_estado = "JUEGO";
            }
          } else if (juego_estado === "PLUS_JUEGO") {
            rects.f1_opciones.forEach((r, i) => {
              if (col(ev.x, ev.y, r)) {
                if (opciones_actuales[i] === retos_partida[3].t) {
                  playSound("exito");
                  intentos++;
                  escudos_guardados_f2 = intentos;
                  juego_estado = "PLUS_RECOMPENSA";
                } else {
                  playSound("error");
                  tiempo_destello_error = t;
                  escudos_guardados_f2 = intentos;
                  indice_reto_f2 = 0;
                  preparar_fase2();
                  sig_estado_puertas = "FASE2_Filtro";
                  juego_estado = "CERRANDO";
                }
              }
            });
          } else if (
            juego_estado === "PLUS_RECOMPENSA" &&
            col(ev.x, ev.y, {
              x: ANCHO / 2 - 160,
              y: ALTO * 0.75,
              w: 320,
              h: 55,
            })
          ) {
            playSound("click");
            indice_reto_f2 = 0;
            preparar_fase2();
            sig_estado_puertas = "FASE2_Filtro";
            juego_estado = "CERRANDO";
          } else if (juego_estado === "FASE2_Filtro") {
            if (col(ev.x, ev.y, rects.opcA)) checkFase2("A", t);
            if (col(ev.x, ev.y, rects.opcB)) checkFase2("B", t);
          } else if (juego_estado === "RETO_CHALLENGE") {
            rects.reto_6.forEach((r, i) => {
              if (col(ev.x, ev.y, r)) {
                if (i === PREGUNTAS_RETO[sub_indice_reto_challenge].correcta) {
                  playSound("exito");
                  sub_indice_reto_challenge++;
                  progreso_matrix_f2 = 0;
                  if (sub_indice_reto_challenge > 2)
                    juego_estado = "FASE2_RECOMPENSA";
                } else {
                  playSound("error");
                  tiempo_destello_error = t;
                  intentos--;
                  feedback_f2_l1 =
                    PREGUNTAS_RETO[sub_indice_reto_challenge].f_l1;
                  feedback_f2_l2 =
                    PREGUNTAS_RETO[sub_indice_reto_challenge].f_l2;
                  juego_estado = "FASE2_EXPLICACION";
                }
              }
            });
          } else if (juego_estado === "FASE2_EXPLICACION") {
            playSound("click");
            if (intentos <= 0) {
              sig_estado_puertas = "GAME_OVER";
              juego_estado = "CERRANDO";
            } else {
              progreso_matrix_f2 = 0;
              juego_estado =
                indice_reto_f2 >= 3 ? "RETO_CHALLENGE" : "FASE2_Filtro";
            }
          } else if (
            juego_estado === "FASE2_RECOMPENSA" &&
            col(ev.x, ev.y, {
              x: ANCHO / 2 - 160,
              y: ALTO * 0.75,
              w: 320,
              h: 55,

            playSound("click");
            sig_estado_puertas = "FASE3_INTRO";
            juego_estado = "CERRANDO";
            tiempo_emergencia = t;
          } else if (juego_estado === "FASE3_COMBATE") {
            torretas_boss.forEach((torre) => {
              if (col(ev.x, ev.y, torre.rect)) {
                if (torre.es_correcta) {
                  playSound("laser");
                  playSound("impacto");
                  tiempo_destello_error = t;
                  indice_pregunta_boss++;
                  if (indice_pregunta_boss >= 3) {
                    juego_estado = "BOSS_COLAPSO";
                    t_inicio_colapso = t;
                    explosiones_boss = [];
                  } else preparar_combate_boss();
                } else {
                  playSound("error");
                  tiempo_destello_error = t;
                  intentos--;
                  if (intentos <= 0) {
                    sig_estado_puertas = "GAME_OVER";
                    juego_estado = "CERRANDO";
                  } else preparar_combate_boss();
                }
              }
            });
          } else if (juego_estado === "FLASH_CORE") {
            if (mostrar_explicacion_flash) {
              if (
                col(ev.x, ev.y, {
                  x: ANCHO / 2 - 340,
                  y: ALTO / 2 - 130,
                  w: 680,
                  h: 260,
                })
              ) {
                playSound("click");
                mostrar_explicacion_flash = false;
                checkFlashNext();
              }
            } else {
              let ans = null;
              if (col(ev.x, ev.y, rects.flash_v)) ans = true;
              else if (col(ev.x, ev.y, rects.flash_f)) ans = false;

              if (ans !== null) {
                if (ans === preguntas_flash_partida[indice_flash_actual].a) {
                  playSound("exito");
                  correctas_flash++;
                  checkFlashNext();
                } else {
                  playSound("error");
                  tiempo_destello_error = t;
                  mostrar_explicacion_flash = true;
                  texto_explicacion_flash =
                    preguntas_flash_partida[indice_flash_actual].exp;
                }
              }
            }
          } else if (
            juego_estado === "FLASH_RESULTADO" ||
            juego_estado === "VICTORIA_TOTAL"
          ) {
            let ry =
              juego_estado === "FLASH_RESULTADO" ? ALTO * 0.78 : ALTO / 2 + 110;
            if (col(ev.x, ev.y, { x: ANCHO / 2 - 250, y: ry, w: 230, h: 55 })) {

              playSound("click");
              preparar_preguntas_flash();
              sig_estado_puertas = "FLASH_CORE";
              juego_estado = "CERRANDO";

          } else if (juego_estado === "GAME_OVER") {
            if (
              col(ev.x, ev.y, {
                x: ANCHO / 2 - 145,

                preparar_fase2();
                sig_estado_puertas = "FASE2_Filtro";

                preparar_combate_boss();
                sig_estado_puertas = "FASE3_COMBATE";

              juego_estado = "CERRANDO";

            if (
              col(ev.x, ev.y, {
                x: ANCHO / 2 - 145,
                y: ALTO * 0.82,
                w: 290,
                h: 55,
              })
            ) {
              playSound("click");
              location.reload();
            }
          }
          clickEvt = null;

        // --- LOGICA ANIMACIONES ---
        if (t - tiempo_destello_error < 280) {
          vibracion_offset_x = (Math.random() - 0.5) * 30;
          vibracion_offset_y = (Math.random() - 0.5) * 30;
        } else if (
          juego_estado === "FASE3_INTRO" &&
          t - tiempo_emergencia < 1400
        ) {
          vibracion_offset_x = (Math.random() - 0.5) * 20;
          vibracion_offset_y = (Math.random() - 0.5) * 20;
        } else if (juego_estado === "BOSS_COLAPSO") {
          vibracion_offset_x = (Math.random() - 0.5) * 40;
          if (t - t_inicio_colapso < 3500) {
            if (Math.random() < 0.25) {
              playSound("impacto");
              explosiones_boss.push({
                x: ANCHO / 2 + (Math.random() - 0.5) * 220,
                y: ALTO * 0.32 + (Math.random() - 0.5) * 120,
                r: 10 + Math.random() * 25,
                c: [BLANCO, AMARILLO_WARN, ROJO_ALERTA][
                  Math.floor(Math.random() * 3)
                ],
              });
            }
          } else {
            sig_estado_puertas = "VICTORIA_TOTAL";
            juego_estado = "CERRANDO";
            flash_desbloqueado = true;
            t_hit = t;
          }
        }

        if (juego_estado === "CERRANDO") {
          pos_puerta_izq += 25;
          pos_puerta_der -= 25;
          if (pos_puerta_izq >= 0) {
            pos_puerta_izq = 0;
            pos_puerta_der = ANCHO / 2;
            playSound("impacto");
            for (let i = 0; i < 40; i++)
              humo.push({
                x: ANCHO / 2,
                y: 100 + Math.random() * (ALTO - 200),
                vx: (Math.random() - 0.5) * 12,
                vy: (Math.random() - 0.5) * 3,
                r: 15 + Math.random() * 15,
              });
            juego_estado =
              sig_estado_puertas === "VICTORIA_TOTAL"
                ? "SISTEMA_REORGANIZANDO"
                : "IMPACTO";
            t_hit = t;
          }
        } else if (juego_estado === "SISTEMA_REORGANIZANDO") {
          if (t - t_hit > 4000) {
            juego_estado = "ABRIENDO";
            fuegos_artificiales = [];
            ultimo_fuego_artificial = t;
          }
        } else if (juego_estado === "IMPACTO") {
          if (t - t_hit > 700) juego_estado = "ABRIENDO";
        } else if (juego_estado === "ABRIENDO") {
          pos_puerta_izq -= 35;
          pos_puerta_der += 35;
          if (pos_puerta_izq <= -ANCHO / 2) juego_estado = sig_estado_puertas;
        } else if (
          juego_estado === "PLUS_POPUP" ||
          juego_estado === "RETO_POPUP"
        ) {
          vibracion_offset_x = (Math.random() - 0.5) * 10;
          if (t - tiempo_emergencia > 2500) {
            if (juego_estado === "PLUS_POPUP") {
              juego_estado = "PLUS_JUEGO";
              progreso_trazado_grafica = 0;
              configurar_opciones_f1(retos_partida[3].t);
            } else {
              juego_estado = "RETO_CHALLENGE";
              t_fisica_reto = 0;
              progreso_particulas_reto = [];
            }
          }
        } else if (juego_estado === "VICTORIA_TOTAL") {
          if (t - ultimo_fuego_artificial > 450) {
            ultimo_fuego_artificial = t;
            playSound("pirotecnia");
            let cx = ANCHO * 0.15 + Math.random() * (ANCHO * 0.7);
            let cy = ALTO * 0.12 + Math.random() * (ALTO * 0.38);
            for (let a = 0; a < 360; a += 45)
              fuegos_artificiales.push({
                x: cx,
                y: cy,
                vx: Math.cos((a * Math.PI) / 180) * 6,
                vy: Math.sin((a * Math.PI) / 180) * 6,
                v: 25,
                c: [
                  ROJO_ALERTA,
                  VERDE_ALERTA,
                  AMARILLO_WARN,
                  CIAN_NEON,
                  ORO_RECOMPENSA,
                ][Math.floor(Math.random() * 5)],
              });
          }
        } else if (juego_estado === "FASE3_INTRO") {
          if (t - tiempo_emergencia > 4000) {
            playSound("click");
            fase_actual = 3;
            preparar_combate_boss();
            sig_estado_puertas = "FASE3_COMBATE";
            juego_estado = "CERRANDO";
          }
        }

        // --- RENDERIZADO VISUAL ---
        ctx.fillStyle = AZUL_FONDO;
        ctx.fillRect(0, 0, ANCHO, ALTO);
        ctx.fillStyle = "rgb(0,45,55)";
        lluvia_matrix.forEach((m) => {
          m.y += m.v;
          if (m.y > ALTO) {
            m.y = -100;
            m.x = Math.random() * ANCHO;
          }
          ctx.fillRect(m.x, m.y, 2, 12);
        });
        ctxRect(
          { x: ANCHO * 0.04, y: ALTO * 0.04, w: ANCHO * 0.92, h: ALTO * 0.92 },
          NEGRO_MONITOR,
          "rgb(15, 45, 65)",
          15,
          6
        );

        ctx.save();
        ctx.translate(vibracion_offset_x, vibracion_offset_y);

        if (juego_estado === "INTRO") {
          if (linea_actual < texto_intro.length && t - ultimo_tecleo > 25) {
            caracteres++;
            ultimo_tecleo = t;
            playSound("tecleo");
            if (caracteres > texto_intro[linea_actual].length) {
              caracteres = 0;
              linea_actual++;
            }
          }
          for (let i = 0; i <= linea_actual; i++) {
            if (i >= texto_intro.length) break;
            drawText(
              texto_intro[i].substring(
                0,
                i === linea_actual ? caracteres : texto_intro[i].length
              ),
              ANCHO / 2,
              ALTO * 0.24 + i * 42,
              f_m,
              CIAN_NEON
            );

          if (linea_actual >= texto_intro.length) {
            ctxRect(rects.continuar, null, CIAN_TERMINAL, 6);
            drawText(
              "CONTINUAR",
              rects.continuar.x + rects.continuar.w / 2,
              rects.continuar.y + rects.continuar.h / 2,
              f_m,
              CIAN_TERMINAL
            );
          }
        } else if (juego_estado === "MENU") {
          drawText(
            "KRONOS SYSTEM",
            ANCHO / 2,
            ALTO * 0.2,
            f_l * 1.5,
            CIAN_NEON
          );
          [
            "INICIAR OPERACION",
            "INSTRUCCIONES",
            `AUDIO: ${audio_on ? "ON" : "OFF"}`,
          ].forEach((txt, i) => {
            let r = {
              x: ANCHO / 2 - 150,
              y: ALTO * 0.38 + i * 70,
              w: 300,
              h: 50,
            };
            ctxRect(r, "rgb(40,80,100)", null, 6);
            drawText(txt, r.x + 150, r.y + 25, f_m, CIAN_NEON);
          });
          if (flash_desbloqueado) {
            let r = {
              x: ANCHO / 2 - 175,
              y: ALTO * 0.38 + 3 * 70,
              w: 350,
              h: 55,
            };
            let lw = 3 + Math.sin(t * 0.01) * 2;
            let c = Math.floor(t / 150) % 2 === 0 ? ORO_RECOMPENSA : CIAN_NEON;
            ctxRect(r, "rgb(50,10,30)", c, 8, lw);
            drawText(
              "MODO FLASH [DESBLOQUEADO]",
              r.x + 175,
              r.y + 27,
              f_m,
              ORO_RECOMPENSA
            );
          }
        } else if (juego_estado === "INSTRUCCIONES") {
          drawTextBorde(
            "MANUAL DEL SISTEMA",
            ANCHO / 2,
            ALTO * 0.1,
            f_l,
            ORO_RECOMPENSA,
            NEGRO_MONITOR
          );
          let rx = ANCHO * 0.1,
            ry = ALTO * 0.2,
            rw = ANCHO * 0.8;
          let cy = ry;

          function drawSection(title, body) {
            drawText(title, ANCHO / 2, cy, f_m, CIAN_TERMINAL);
            cy += f_m * 1.5;
            let words = body.split(" "),
              line = "";
            ctx.font = `bold ${f_s}px 'Courier New'`;
            ctx.fillStyle = BLANCO;
            ctx.textAlign = "center";
            for (let n = 0; n < words.length; n++) {
              let testLine = line + words[n] + " ",
                m = ctx.measureText(testLine);
              if (m.width > rw && n > 0) {
                ctx.fillText(line.trim(), ANCHO / 2, cy);
                line = words[n] + " ";
                cy += f_s * 1.5;
              } else {
                line = testLine;
              }
            }
            ctx.fillText(line.trim(), ANCHO / 2, cy);
            cy += f_s * 2.5;
          }

          if (pagina_instrucciones === 0) {

            drawSection(
              "LORE DEL SISTEMA:",
              "KRONOS es un complejo y vital sistema matematico que actualmente esta siendo atacado y vulnerado. La unica forma de erradicar esta amenaza es destruyendo el nucleo del virus central, pero para llegar a el deberas superar distintas pruebas de las que hablaremos a continuacion. Nombrado en honor al Titan del tiempo, este servidor procesa datos a velocidades inimaginables y ahora depende de ti para purgar la infeccion."
            );
            drawSection(
              "FASE 1 - IDENTIFICACION:",
              "El sistema mostrara una expresion matematica. Debes analizar la ecuacion y seleccionar el boton (A, B, C o D) con la clasificacion de funcion correcta para reparar los nodos."
            );
          } else {
            drawSection(
              "FASE 2 - FILTROS Y RETO:",
              "Supera los filtros teoricos resolviendo preguntas basicas. Luego, analiza detalladamente la grafica y la trayectoria de un proyectil en pantalla para resolver el modelo cuadratico."
            );
            drawSection(
              "FASE 3 - COMBATE DE CUADRANTES:",
              "El Jefe Virus saltara a distintos cuadrantes del plano cartesiano. Para atacarlo, debes seleccionar el boton (A, B, C o D) que contenga el par de signos (+,-) correspondiente al cuadrante donde se ubico."
            );
            drawSection(
              "MODO FLASH (OCULTO):",
              "Desbloqueable al finalizar. Tienes 120 SEGUNDOS para responder la mayor cantidad de preguntas con los botones de VERDADERO o FALSO. El tiempo penaliza."
            );
          }

          let btn_volver = {
            x: ANCHO / 2 - 220,
            y: ALTO * 0.88,
            w: 200,
            h: 40,
          };
          let btn_sig = { x: ANCHO / 2 + 20, y: ALTO * 0.88, w: 200, h: 40 };
          ctxRect(btn_volver, "rgb(30,50,70)", CIAN_TERMINAL, 6);
          drawText(
            pagina_instrucciones === 0 ? "VOLVER" : "ANTERIOR",
            btn_volver.x + 100,
            btn_volver.y + 20,
            f_s,
            CIAN_NEON
          );
          if (pagina_instrucciones === 0) {
            ctxRect(btn_sig, "rgb(30,50,70)", CIAN_TERMINAL, 6);
            drawText(
              "SIGUIENTE",
              btn_sig.x + 100,
              btn_sig.y + 20,
              f_s,
              CIAN_NEON
            );
          }
        } else if (juego_estado === "JUEGO") {
          drawTextBorde(
            "Selecciona la opcion correcta:",
            ANCHO / 2,
            ALTO * 0.09,
            f_m,
            CIAN_NEON,
            NEGRO_MONITOR
          );
          drawTextBorde(
            "¿Que funcion representa el modelo mostrado?",
            ANCHO / 2,
            ALTO * 0.14,
            f_m,
            VERDE_ALERTA,
            NEGRO_MONITOR
          );
          drawText(
            `RETOS: ${indice_reto}/3  |  ESCUDOS: ${intentos}`,
            ANCHO / 2,
            ALTO * 0.2,
            f_s,
            CIAN_NEON
          );

          let r_d = {
            x: ANCHO * 0.12,
            y: ALTO * 0.26,
            w: ANCHO * 0.76,
            h: ALTO * 0.36,
          };
          ctxRect(r_d, NEGRO_MONITOR, CIAN_TERMINAL, 8);

          let eq = retos_partida[indice_reto].e;

            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(ANCHO / 4, fy);
            ctx.lineTo(ANCHO / 4 + 150, fy);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(ANCHO * 0.75 - 150, ALTO - fy);
            ctx.lineTo(ANCHO * 0.75, ALTO - fy);
            ctx.stroke();
          }
          if (
            [
              "CERRANDO",
              "IMPACTO",
              "ABRIENDO",
              "SISTEMA_REORGANIZANDO",
            ].includes(juego_estado)
          ) {
            ctx.strokeStyle = CIAN_TERMINAL;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(pos_puerta_izq + ANCHO / 2 - 2, 0);
            ctx.lineTo(pos_puerta_izq + ANCHO / 2 - 2, ALTO);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(pos_puerta_der, 0);
            ctx.lineTo(pos_puerta_der, ALTO);
            ctx.stroke();
          }
          for (let i = humo.length - 1; i >= 0; i--) {
            let p = humo[i];
            p.x += p.vx;
            p.y += p.vy;
            p.r -= 0.4;
            if (p.r <= 0) humo.splice(i, 1);
            else {
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
              ctx.fillStyle = "rgb(100,125,140)";
              ctx.fill();
            }
          }
        }

        scanline_y = (scanline_y + 2) % ALTO;
        ctx.fillStyle = "rgba(0,230,255,0.08)";
        ctx.fillRect(0, scanline_y, ANCHO, 2);
      }

      // --- SUB-RUTINAS DE DIBUJO ---
      function scrambled(txt, prog, chars = "@#$%") {
        let r = "";
        for (let i = 0; i < txt.length; i++)
          r +=
            i < prog ? txt[i] : chars[Math.floor(Math.random() * chars.length)];
        return r;
      }
      function checkFase2(opc, t) {
        if (pregunta_fase2_actual.correcta === opc) {
          playSound("exito");
          indice_reto_f2++;
          if (indice_reto_f2 >= 3) {
            progreso_matrix_f2 = 0;
            sub_indice_reto_challenge = 0;
            juego_estado = "RETO_POPUP";
            tiempo_emergencia = t;
            playSound("sirena");
          } else preparar_fase2();
        } else {
          playSound("error");
          tiempo_destello_error = t;
          intentos--;
          feedback_f2_l1 = pregunta_fase2_actual.f_l1;
          feedback_f2_l2 = pregunta_fase2_actual.f_l2;
          juego_estado = "FASE2_EXPLICACION";
        }
      }
      function checkFlashNext() {
        indice_flash_actual++;
        if (indice_flash_actual >= preguntas_flash_partida.length)
          juego_estado = "FLASH_RESULTADO";
      }

      function dibujar_grafica(r) {
        ctxRect(r, "rgb(5,25,20)", ROJO_ALERTA, 0, 3);
        let cx = r.x + r.w / 2,
          cy = r.y + r.h / 2;
        ctx.strokeStyle = "rgb(30,60,45)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(r.x, cy);
        ctx.lineTo(r.x + r.w, cy);
        ctx.moveTo(cx, r.y);
        ctx.lineTo(cx, r.y + r.h);
        ctx.stroke();

        let tp = retos_partida[3].t;
        let pts = [];
        if (progreso_trazado_grafica < 1.0) progreso_trazado_grafica += 0.02;
        let lim = (r.w / 2) * progreso_trazado_grafica;

        for (let px = 0; px < r.w; px++) {
          let dc = px - r.w / 2;
          if (Math.abs(dc) <= lim) {
            let x = dc * 0.08,
              y = 0;
            if (tp === "SENO") y = Math.sin(x) * 45;
            else if (tp === "COSENO") y = Math.cos(x) * 45;
            else if (tp === "LINEAL") y = x * 18;
            else if (tp === "CONSTANTE") y = 30;
            else if (tp === "VALOR ABSOLUTO") y = Math.abs(x) * 18;
            let ly = cy - y;
            if (ly > r.y && ly < r.y + r.h) pts.push({ x: r.x + px, y: ly });
          }
        }
        if (pts.length > 1) {
          ctx.beginPath();
          ctx.strokeStyle = CIAN_NEON;
          ctx.lineWidth = 4;
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
          ctx.stroke();
        }
      }

      function dibujar_fisicas(r) {
        ctxRect(r, "rgb(8,14,25)", CIAN_TERMINAL, 8);
        let py = r.y + r.h - 25;
        ctx.strokeStyle = "rgb(0,80,100)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(r.x, py);
        ctx.lineTo(r.x + r.w, py);
        ctx.stroke();
        let mw = 65,
          mh = r.h * 0.65,
          mx = r.x + 80,
          my = py - mh;
        ctxRect({ x: mx, y: my, w: mw, h: mh }, GRIS_MURO, null, 4);
        let nx = mx + mw - 20,
          ny = my - 30;
        ctx.beginPath();
        ctx.arc(nx, ny, 10, 0, Math.PI * 2);
        ctx.fillStyle = CIAN_NEON;
        ctx.fill();

        t_fisica_reto += 0.045;
        if (t_fisica_reto > 6.5) {
          t_fisica_reto = 0;
          progreso_particulas_reto = [];
        }
        let px = nx + 38.0 * t_fisica_reto;
        let pty =
          ny +
          -22.0 * t_fisica_reto +
          0.5 * 14.0 * (t_fisica_reto * t_fisica_reto);
        if (pty < py && px < r.x + r.w)
          progreso_particulas_reto.push({ x: px, y: pty });
        progreso_particulas_reto.forEach((pt) => {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      function dibujar_virus(cx, cy, tp, dano) {
        let aw = SPRITE_VIRUS[0].length * tp,
          ah = SPRITE_VIRUS.length * tp;
        let sx = cx - aw / 2,
          sy = cy - ah / 2;
        for (let r = 0; r < SPRITE_VIRUS.length; r++) {
          for (let c = 0; c < SPRITE_VIRUS[0].length; c++) {
            let v = SPRITE_VIRUS[r][c];
            if (v !== 0) {
              let px = sx + c * tp,
                py = sy + r * tp;
              if (dano)
                ctx.fillStyle = [BLANCO, ROJO_ALERTA, VIRUS_COLOR][
                  Math.floor(Math.random() * 3)
                ];
              else ctx.fillStyle = v === 1 ? VIRUS_COLOR : ROJO_ALERTA;
              ctx.fillRect(px, py, tp - 1, tp - 1);
            }
          }
        }
      }

      function wrapText(context, text, x, y, maxWidth, lineHeight, color) {
        let words = text.split(" "),
          line = "";
        ctx.fillStyle = color;
        for (let n = 0; n < words.length; n++) {
          let testLine = line + words[n] + " ",
            m = context.measureText(testLine);
          if (m.width > maxWidth && n > 0) {
            context.fillText(line.trim(), x, y);
            line = words[n] + " ";
            y += lineHeight;
          } else {
            line = testLine;
          }
        }
        context.fillText(line.trim(), x, y);
      }

      requestAnimationFrame(loop);
    </script>
